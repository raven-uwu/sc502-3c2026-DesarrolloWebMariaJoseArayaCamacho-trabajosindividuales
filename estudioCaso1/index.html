<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Estudio de caso 1</title>
    <link rel="stylesheet" href="estilo.css">
  </head>
  <body>
    <header>
      <h1>Registro de estudiantes</h1>
    </header>

    <section>
      <label>Nombre</label>
      <input type="text" id="nombre">
      <br>
      <label>Apellidos</label>
      <input type="text" id="apellidos">
      <br>
      <label>Nota (0 a 100)</label>
      <input type="number" id="nota" min="0" max="100">
      <br>
      <button onclick="agregarEstudiante()">Agregar estudiante</button>
      <p id="mensaje"></p>
    </section>

    <section>
      <table id="tabla"></table>
    </section>

    <section>
      <h2>Resumen</h2>
      <p id="resumenMayor"></p>
      <p id="resumenPromedio"></p>
      <p id="resumenMenor"></p>
    </section>

    <script src="codigo.js"></script>
  </body>
</html>
