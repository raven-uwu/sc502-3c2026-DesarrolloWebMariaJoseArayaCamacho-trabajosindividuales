<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>

    <form action="/submit-form" method="post">
      <label for="first-name">Enter Your First Name:</label>
      <input type="text" id="first-name" name="first-name" required>

      <label for="last-name">Enter Your Last Name:</label>
      <input type="text" id="last-name" name="last-name" required>

      <label for="email">Enter Your Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Create a New Password:</label>
      <input type="password" id="password" name="password" required>

      <hr>

      <p>Account type (required)</p>
      <div class="option">
        <input type="radio" id="personal" name="account-type" value="personal" checked required>
        <label for="personal">Personal</label>
      </div>
      <div class="option">
        <input type="radio" id="business" name="account-type" value="business" required>
        <label for="business">Business</label>
      </div>

      <hr>

      <label for="profile-picture">Upload a profile picture:</label>
      <input type="file" id="profile-picture" name="profile-picture" accept="image/*">

      <label for="age">Input your age (years):</label>
      <input type="number" id="age" name="age" min="0" max="120">

      <label for="referral">How did you hear about us?</label>
      <select id="referral" name="referral">
        <option value="">(select one)</option>
        <option value="news">freeCodeCamp News</option>
        <option value="youtube">freeCodeCamp YouTube Channel</option>
        <option value="forum">freeCodeCamp Forum</option>
        <option value="other">Other</option>
      </select>

      <label for="bio">Provide a bio:</label>
      <textarea id="bio" name="bio" rows="4" placeholder="I like coding on the beach..."></textarea>

      <div class="option">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I accept the <a href="#">terms and conditions</a></label>
      </div>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
